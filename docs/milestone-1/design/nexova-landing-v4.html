document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt-size:14px;color:#1C1915\">Courses<\/li>\n                <li style=\"padding:6px 14px;border:1px solid #1C1915;border-radius:999px;font-size:14px;color:#1C1915\">Workshops<\/li>\n                <li style=\"padding:6px 14px;border:1px solid #1C1915;border-radius:999px;font-size:14px;color:#1C1915\">Webinars<\/li>\n              <\/ul>\n            <\/div>\n            <a href=\"#contact\" aria-label=\"Learn more about leadership and soft-skills training\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:600;color:#1C1915;text-decoration:none;text-underline-offset:5px\" style-hover=\"text-decoration:underline;color:#1C1915\">Learn more <span aria-hidden=\"true\">\u2192<\/span><\/a>\n          <\/div>\n        <\/article>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"process\" aria-labelledby=\"process-h\" style=\"background:#EFE8DC;padding:clamp(88px,10vw,144px) 0\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px)\">\n    <h2 id=\"process-h\" data-reveal=\"0\" style=\"margin:0;font-size:clamp(34px,4.2vw,60px);font-weight:500;letter-spacing:-0.04em;line-height:1.02;color:#143D36;text-wrap:balance;max-width:17ch\">From a wide field to the right person, in four steps.<\/h2>\n    <div data-proc=\"\" style=\"position:relative;margin-top:clamp(48px,6vw,88px)\">\n      <div aria-hidden=\"true\" style=\"display:{{ hLine }};position:absolute;left:0;right:0;top:0;height:2px;background:#E4DACB;overflow:hidden\"><div data-proc-h=\"\" style=\"height:100%;background:#E2603B;transform:scaleX(0);transform-origin:0 50%\"><\/div><\/div>\n      <div aria-hidden=\"true\" style=\"display:{{ vLine }};position:absolute;left:5px;top:0;bottom:0;width:2px;background:#E4DACB;overflow:hidden\"><div data-proc-v=\"\" style=\"width:100%;height:100%;background:#E2603B;transform:scaleY(0);transform-origin:50% 0\"><\/div><\/div>\n      <ol style=\"list-style:none;margin:0;padding:{{ stepPad }}; yle=\"position:absolute;inset:0;color:#B3431E;clip-path:inset(0 100% 0 0);transition:clip-path 650ms cubic-bezier(.7,0,.2,1)\">Financial services<\/span><\/span>\n          <span style=\"display:block;max-width:40ch;font-size:17px;line-height:1.6;color:#3D372F;text-wrap:pretty\">Discreet searches for roles where judgement, compliance and trust are non-negotiable.<\/span>\n        <\/span>\n      <\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"ai\" aria-labelledby=\"ai-h\" style=\"background:#143D36;color:#F6F1E9;padding:clamp(88px,10vw,144px) 0\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px clamp(40px,6vw,96px);align-items:end\">\n      <h2 id=\"ai-h\" data-reveal=\"0\" style=\"margin:0;font-size:clamp(34px,4.2vw,60px);font-weight:500;letter-spacing:-0.04em;line-height:1.02;color:#F6F1E9;text-wrap:balance;max-width:14ch\">AI does the sorting. <span style=\"color:#F08A66\">People make the call.<\/span><\/h2>\n      <p data-reveal=\"1\" style=\"margin:0;font-size:17px;line-height:1.6;color:#C9D6D1;max-width:56ch;text-wrap:pretty\">We use AI and automation to move faster and work at greater scale. Here is where it helps and where it stops. No candidate is ever rejected by an algorithm, and one client's data never mixes with another's.<\/p>\n    <\/div>\n    <p data-words=\"\" style=\"margin:clamp(64px,8vw,120px) 0;font-size:clamp(28px,3.5vw,52px);font-weight:500;letter-spacing:-0.035em;line-height:1.16;color:#F6F1E9;max-width:24em;text-wrap:pretty\">Every hiring decision, every customer escalation and every training plan is signed off by a person. AI makes us faster. <span style=\"color:#F08A66\">People make it right.<\/span><\/p>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px clamp(24px,3vw,48px)\">\n      <div data-reveal=\"0\" style=\"border-top:1px soli nalises practice and follow-up between sessions.<\/dd><\/div>\n          <div style=\"border-top:1px solid #2C5A52;padding-top:18px\"><dt style=\"font-size:15px;font-weight:600;color:#F08A66\">People<\/dt><dd style=\"margin:4px 0 0;font-size:16.5px;line-height:1.6;color:#C9D6D1\">Design the programme, lead the room and coach your managers.<\/dd><\/div>\n        <\/dl>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"about\" aria-labelledby=\"about-h\" style=\"padding:clamp(88px,10vw,144px) 0\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px clamp(40px,6vw,96px);align-items:start\">\n      <h2 id=\"about-h\" data-reveal=\"0\" style=\"margin:0;font-size:clamp(34px,4.2vw,60px);font-weight:500;letter-spacing:-0.04em;line-height:1.02;color:#143D36;text-wrap:balance;max-width:15ch\">Born in Valencia in 2011. Now on both sides of the Atlantic.<\/h2>\n      <div style=\"display:flex;flex-direction:column;gap:18px;padding-top:8px\">\n        <p data-reveal=\"1\" style=\"margin:0;font-size:17px;line-height:1.6;color:#3D372F;max-width:56ch;text-wrap:pretty\">Nexova Solutions started in Valencia in 2011 as a human resources consulting and talent acquisition firm. For more than twelve years we have helped mid-sized technology, retail and financial services companies find their leaders, build their customer support teams and develop their people.<\/p>\n        <p data-reveal=\"2\" style=\"margin:0;font-size:17px;line-height:1.6;color:#3D372F;max-width:56ch;text-wrap:pretty\">Today we are 120 people across selection, support, training and operations, working from our headquarters in Valencia and our expansion office in Miami, Florida, for clients in Spain and the US.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top:clamp(48px,6vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(16px,2vw,28px)\">\n      <figure data-photo=\"\" style=\"position:relative;margin:0;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:#EFE8DC\">\n        <div data-parallax=\"\" style=\"position:absolute;left:0;right:0;top:-8%;height:116%;background:repeating-linear-gradient(135deg,#EFE8DC 0 14px,#E9E1D4 14px 28px);display:flex;align-items:center;justify-content:center\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#5E554B;padding:0 24px;text-align:center\">photo: Valencia, City of Arts and Sciences<\/span>\n        <\/div>\n        <figcaption style=\"position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:#F6F1E9;color:#143D36;font-size:15px;box-shadow:0 18px 36px -20px rgba(20,61,54,.5)\">\n          <span style=\"position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#E2603B\"><span style=\"position:absolute;inset:0;border-radius:50%;background:#E2603B;animation:nxDot 1.8s cubic-bezier(.2,.7,.2,1) infinite\"><\/span><\/span>\n          <span style=\"font-weight:600\">Valencia<\/span><time style=\"font-variant-numeric:tabular-nums;color:#3D372F\">{{ vlcTime }}<\/time>\n        <\/figcaption>\n      <\/figure>\n      <figure data-photo=\"\" style=\"position:relative;margin:0;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:#EFE8DC\">\n        <div data-parallax=\"\" style=\"position:absolute;left:0;right:0;top:-8%;height:116%;background:repeating-linear-gradient(135deg,#EFE8DC 0 14px,#E9E1D4 14px 28px);display:flex;align-items:center;justify-content:center\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#5E554B;padding:0 24px;text-align:center\">photo: Miami, Brickell waterfront<\/span>\n        <\/div>\n        <figcaption style=\"position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:#F6F1E9;color:#143D36;font-size:15px;box-shadow:0 18px 36px -20px rgba(20,61,54,.5)\">\n          <span style=\"position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#E2603B\"><span style=\"position:absolute;inset:0;border-radius:50%;background:#E2603B;animation:nxDot 1.8s cubic-bezier(.2,.7,.2,1) infinite\"><\/span><\/span>\n          <span style=\"font-weight:600\">Miami<\/span><time style=\"font-variant-numeric:tabular-nums;color:#3D372F\">{{ miaTime }}<\/time>\n        <\/figcaption>\n      <\/figure>\n    <\/div>\n    <p data-reveal=\"0\" style=\"margin:clamp(32px,4vw,48px) 0 0;font-size:clamp(26px,2.8vw,40px);font-weight:500;letter-spacing:-0.03em;line-height:1.15;color:#143D36\"><span style=\"font-variant-numeric:tabular-nums\">{{ hoursApart }}<\/span> hours apart. One team.<\/p>\n  <\/div>\n<\/section>\n\n<section id=\"contact\" aria-labelledby=\"contact-h\" style=\"padding:0 clamp(12px,2vw,24px) clamp(64px,8vw,112px)\">\n  <div data-reveal=\"0\" style=\"max-width:1392px;margin:0 auto;background:#E2603B;border-radius:40px;padding:clamp(40px,7vw,112px) clamp(24px,6vw,96px);box-sizing:border-box\">\n    <h2 id=\"contact-h\" style=\"margin:0;font-size:clamp(36px,5vw,76px);font-weight:500;letter-spacing:-0.045em;line-height:1.02;color:#0C2722;max-width:17ch;text-wrap:balance\">Your next leader, team or programme starts with a <span style=\"color:#F6F1E9\">conversation<\/span>.<\/h2>\n    <p style=\"margin:28px 0 0;font-size:18px;line-height:1.6;color:#1C1915;max-width:52ch;text-wrap:pretty\">Tell us what you need. A consultant from Valencia or Miami will get back to you to set up a first call.<\/p>\n    <div style=\"margin-top:40px;display:flex;flex-wrap:wrap;gap:12px\">\n      <a href=\"mailto:hello@nexova.example?subject=Start%20a%20search\" data-magnetic=\"\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border-radius:999px;background:#143D36;color:#F6F1E9;text-decoration:none;font-size:16.5px;font-weight:600\" style-hover=\"background:#0C2722;color:#F6F1E9\">Start a search<\/a>\n      <a href=\"mailto:hello@nexova.example\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border-radius:999px;border:1.5px solid #1C1915;color:#1C1915;text-decoration:none;font-size:16.5px;font-weight:600;box-sizing:border-box\" style-hover=\"background:#1C1915;color:#F6F1E9\">Talk to us<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<footer style=\"background:#0C2722;color:#C9D6D1;padding:clamp(64px,7vw,96px) 0 32px\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:40px clamp(24px,3vw,48px)\">\n      <div style=\"grid-column:span 1;min-width:0\">\n        <a href=\"#top\" style=\"display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;color:#F6F1E9;font-size:26px;font-weight:600;letter-spacing:-0.035em\">Nexova<span style=\"width:7px;height:7px;border-radius:50%;background:#E2603B;margin-top:9px\"><\/span><\/a>\n        <p style=\"margin:10px 0 0;font-size:15.5px;line-height:1.55;max-width:26ch\">HR consulting and talent acquisition since 2011.<\/p>\n      <\/div>\n      <div>\n        <h2 style=\"margin:0 0 14px;font-size:15px;font-weight:600;color:#F6F1E9\">Offices<\/h2>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:14px;font-size:15.5px;line-height:1.45\">\n          <li>Valencia, Spain<br><span style=\"color:#9FB5AE\">Headquarters<\/span><\/li>\n          <li>Miami, Florida<br><span style=\"color:#9FB5AE\">Expansion office<\/span><\/li>\n        <\/ul>\n      <\/div>\n      <nav aria-label=\"Footer\">\n        <h2 style=\"margin:0 0 14px;font-size:15px;font-weight:600;color:#F6F1E9\">Navigate<\/h2>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;font-size:15.5px\">\n          <li><a href=\"#services\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">Services<\/a><\/li>\n          <li><a href=\"#process\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">How we work<\/a><\/li>\n          <li><a href=\"#industries\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">Industries<\/a><\/li>\n          <li><a href=\"#about\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">About<\/a><\/li>\n          <li><a href=\"#contact\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">Contact<\/a><\/li>\n        <\/ul>\n      <\/nav>\n      <div>\n        <h2 style=\"margin:0 0 14px;font-size:15px;font-weight:600;color:#F6F1E9\">Legal<\/h2>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;font-size:15.5px\">\n          <li><a href=\"#\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">Privacy policy<\/a><\/li>\n          <li><a href=\"#\" style=\"display:inline-flex;align-items:center;min-height:36px;color:#C9D6D1;text-decoration:none\" style-hover=\"color:#F6F1E9;text-decoration:underline\">Cookie policy<\/a><\/li>\n          <li><button type=\"button\" style=\"display:inline-flex;align-items:center;min-height:36px;padding:0;border:0;background:transparent;color:#C9D6D1;font:inherit;cursor:pointer\" style-hover=\"color:#F6F1E9;text-decoration:underline\">Cookie settings<\/button><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n    <p style=\"margin:64px 0 0;padding-top:24px;border-top:1px solid #2C5A52;font-size:14px;color:#9FB5AE\">\u00a9 2026 Nexova Solutions. All rights reserved.<\/p>\n  <\/div>\n<\/footer>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { menuOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1440, now: Date.now() };\n  rootRef = React.createRef();\n  timers = [];\n  cvTimers = [];\n\n  later(fn, ms, list) { const id = setTimeout(fn, ms); (list || this.timers).push(id); return id; }\n\n  componentDidMount() {\n    const root = this.rootRef.current; if (!root) return;\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.q = s => Array.from(root.querySelectorAll(s));\n    this.clock = setInterval(() => this.setState({ now: Date.now() }), 15000);\n    this.onKey = e => {\n      if (e.key === 'Escape' && this.state.menuOpen) {\n        this.setState({ menuOpen: false });\n        const b = root.querySelector('[data-menubtn]'); b && b.focus();\n      }\n    };\n    document.addEventListener('keydown', this.onKey);\n    this.onScroll = () => { if (this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = 0; this.tick(); }); };\n    this.onResize = () => {\n      const w = window.innerWidth, o = this.state.w;\n      if ((w < 860) !== (o < 860) || (w < 1024) !== (o < 1024)) this.setState({ w });\n      this.onScroll();\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    this.setupReveals(); this.setupHero(); this.setupMarquee(); this.setupMagnetic();\n    this.setupCounts(); this.setupIndustries(); this.setupSpots(); this.setupWords(); this.setupPhotos();\n    this.setupCascade();\n    this.tick();\n  }\n\n  componentDidUpdate(pp, ps) {\n    if (this.state.menuOpen && !(ps && ps.menuOpen)) {\n      const a = this.rootRef.current && this.rootRef.current.querySelector('[data-mnav] a'); a && a.focus();\n    }\n    if (ps && ps.w !== this.state.w) this.onScroll && this.onScroll();\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.clock);\n    this.timers.concat(this.cvTimers).forEach(clearTimeout);\n    document.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onResize);\n    (this.observers || []).forEach(o => o.disconnect());\n  }\n\n  observe(el, fn, threshold) {\n    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); fn(e.target); } }), { threshold: threshold == null ? 0.15 : threshold });\n    io.observe(el); (this.observers = this.observers || []).push(io); return io;\n  }\n  inView(el) { const r = el.getBoundingClientRect(); return r.top < window.innerHeight && r.bottom > 0; }\n\n  setupReveals() {\n    if (this.reduced) return;\n    this.q('[data-reveal]').forEach(el => {\n      if (this.inView(el)) return;\n      el.style.opacity = '0'; el.style.transform = 'translateY(32px)';\n      this.observe(el, t => {\n        const d = (+t.dataset.reveal || 0) * 100, e = 'cubic-bezier(.2,.7,.2,1)';\n        t.style.transition = `opacity 700ms ${e} ${d}ms, transform 700ms ${e} ${d}ms`;\n        t.style.opacity = '1'; t.style.transform = 'none';\n      });\n    });\n  }\n\n  setupHero() {\n    if (this.reduced) return;\n    const e = 'cubic-bezier(.2,.7,.2,1)';\n    this.q('[data-rise]').forEach((el, i) => el.animate([{ transform: 'translateY(108%)' }, { transform: 'translateY(0)' }], { duration: 900, delay: 100 + i * 110, easing: e, fill: 'backwards' }));\n    this.q('[data-hero-fade]').forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: i === 0 ? 0 : 420 + i * 100, easing: e, fill: 'backwards' }));\n    const roles = ['a CFO.', 'a Head of Customer Support.', 'a Regional Retail Director.', 'a VP of Engineering.', 'a multilingual chat team.', 'a leadership programme.'];\n    const el = this.rootRef.current.querySelector('[data-ticker]'); if (!el) return;\n    let i = 0;\n    const step = () => {\n      i++;\n      const out = el.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-100%)', opacity: 0 }], { duration: 280, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'forwards' });\n      out.onfinish = () => {\n        el.textContent = roles[i % roles.length];\n        el.animate([{ transform: 'translateY(100%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 460, easing: e });\n        out.cancel();\n        if (i < roles.length) this.later(step, 1700);\n      };\n    };\n    this.later(step, 2400);\n  }\n\n  setupMarquee() {\n    const tr = this.rootRef.current.querySelector('[data-marquee]'); if (!tr || this.reduced) return;\n    const a = tr.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }], { duration: 42000, iterations: Infinity });\n    const wrap = tr.parentElement;\n    wrap.addEventListener('mouseenter', () => a.pause()); wrap.addEventListener('mouseleave', () => a.play());\n  }\n\n  setupMagnetic() {\n    if (this.reduced) return;\n    this.q('[data-magnetic]').forEach(el => {\n      el.style.transition = 'transform 250ms cubic-bezier(.2,.7,.2,1)';\n      el.addEventListener('pointermove', ev => {\n        if (ev.pointerType !== 'mouse') return;\n        const r = el.getBoundingClientRect();\n        el.style.transform = `translate(${(ev.clientX - r.left - r.width / 2) * 0.22}px, ${(ev.clientY - r.top - r.height / 2) * 0.32}px)`;\n      });\n      el.addEventListener('pointerleave', () => { el.style.transform = 'translate(0,0)'; });\n    });\n  }\n\n  setupCounts() {\n    if (this.reduced) return;\n    this.q('[data-count]').forEach(el => {\n      if (this.inView(el)) return;\n      const to = +el.dataset.cou
